<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 20% 20%, #1e3a8a, #0f172a 60%);
    color: #f8fafc;
  }
  .card {
    text-align: center;
    padding: 3rem 4rem;
    border-radius: 1.5rem;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  h1 {
    margin: 0;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { margin: 1rem 0 1.75rem; color: #cbd5e1; }
  button {
    font: inherit;
    padding: 0.7rem 1.6rem;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #0f172a;
    background: linear-gradient(90deg, #60a5fa, #c084fc);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(96, 165, 250, 0.35); }
  #time { margin-top: 1.25rem; font-variant-numeric: tabular-nums; color: #94a3b8; min-height: 1.2em; }
</style>
</head>
<body>
  <main class="card">
    <h1>Hello, world!</h1>
    <p>A tiny page, freshly built.</p>
    <button id="greet">Say hello</button>
    <div id="time"></div>
  </main>
<script>
  const greetings = ["Hello, world!", "Hola, mundo!", "Bonjour, le monde!", "Hallo, Welt!", "こんにちは世界", "Ciao, mondo!"];
  let i = 0;
  document.getElementById("greet").addEventListener("click", () => {
    i = (i + 1) % greetings.length;
    document.querySelector("h1").textContent = greetings[i];
  });
  const time = document.getElementById("time");
  setInterval(() => { time.textContent = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
